services:
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: ${BUILD_TARGET:-dev}
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["sh", "-c", "pnpm --filter database db:generate && pnpm --filter database db:deploy"]
    volumes:
      - prisma-generated:/app/packages/database/generated
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: ${BUILD_TARGET:-dev}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
      - ./packages:/app/packages
      - prisma-generated:/app/packages/database/generated
    depends_on:
      pgsql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: ${BUILD_TARGET:-dev}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      # Mount source for hot-reload in dev; ignored in prod via BUILD_TARGET=prod
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages:/app/packages
      - prisma-generated:/app/packages/database/generated
    depends_on:
      pgsql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  pgsql:
    image: postgres:${POSTGRES_VERSION:-18}
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgsql-data:/var/lib/postgresql/18/main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgsql-data:
  prisma-generated:
